[project]
name = "asr-bench"
version = "0.1.0"
description = "Speech-to-text quality benchmark for contact-center conditions"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
asr-bench = "asr_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
