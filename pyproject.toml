[project]
name = "asr-bench"
version = "0.1.0"
description = "Speech-to-text quality benchmark for contact-center conditions"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "jiwer>=4.0.0",
    "numpy>=2.5.5",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "whisper-normalizer>=1.0.1",
]

[project.scripts]
asr-bench = "asr_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
